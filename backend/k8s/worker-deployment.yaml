apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeform-outbox-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgeform-outbox-worker
  template:
    metadata:
      labels:
        app: forgeform-outbox-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: outbox-worker
          image: ghcr.io/your-org/forgeform-api:latest
          command: ["python", "-m", "app.workers.outbox_worker"]
          envFrom:
            - configMapRef:
                name: forgeform-api-config
            - secretRef:
                name: forgeform-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
