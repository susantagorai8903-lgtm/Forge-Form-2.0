apiVersion: v1
kind: Secret
metadata:
  name: forgeform-api-secrets
type: Opaque
stringData:
  DATABASE_URL: "replace-with-neon-async-postgresql-url"
  JWT_SECRET_KEY: "replace-with-a-random-secret-at-least-32-characters"
  KAFKA_BOOTSTRAP_SERVERS: "replace-with-managed-kafka-bootstrap"
  KAFKA_SASL_USERNAME: "replace-with-managed-kafka-username"
  KAFKA_SASL_PASSWORD: "replace-with-managed-kafka-password"
  EMAIL_API_KEY: "replace-with-email-provider-key"
  EMAIL_FROM_ADDRESS: "replace-with-verified-sender"
