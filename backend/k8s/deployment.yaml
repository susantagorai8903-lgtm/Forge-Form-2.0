apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeform-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgeform-api
  template:
    metadata:
      labels:
        app: forgeform-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/your-org/forgeform-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: forgeform-api-config
            - secretRef:
                name: forgeform-api-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
